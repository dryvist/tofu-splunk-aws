name: OpenTofu CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.tf"
      - "**.tofu"
      - "**.tfvars"
      - "**.tftest.hcl"
      - ".terraform.lock.hcl"
      - ".github/workflows/tofu-ci.yml"
  push:
    branches:
      - main
    paths:
      - "**.tf"
      - "**.tofu"
      - "**.tfvars"
      - "**.tftest.hcl"
      - ".terraform.lock.hcl"
      - ".github/workflows/tofu-ci.yml"

permissions:
  contents: read

jobs:
  opentofu:
    name: OpenTofu
    uses: VisiCore/.github/.github/workflows/opentofu.yml@main
    with:
      run_fmt: true
      run_validate: true
      run_test: true
      run_tflint: true
