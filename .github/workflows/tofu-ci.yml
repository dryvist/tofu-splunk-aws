# fmt/init/validate/tflint run in the org CI gate (`tofu_ci`); this keeps
# what the gate does not do: the advisory Trivy config scan and `tofu test`.
name: OpenTofu Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tofu:
    name: 'OpenTofu Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Init (no backend)
        run: tofu init -backend=false

      - name: Test
        run: tofu test -no-color
